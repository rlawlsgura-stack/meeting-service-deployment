[project]
name = "meeting-service"
version = "1.0.0"
description = "React and FastAPI scheduling service runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.4,<0.163",
    "httpx>=0.28.1,<0.29",
    "langchain>=1.5.0,<1.6",
    "langchain-core>=1.8.1,<1.9",
    "langchain-openai>=1.7.4,<1.8",
    "langgraph>=1.2.20,<1.3",
    "mcp>=2.3.0,<2.4",
    "psycopg[binary,pool]>=3.3.8,<3.4",
    "pydantic>=2.14.3,<2.15",
    "python-dotenv>=1.2.4,<1.3",
    "supabase>=2.34.1,<2.35",
    "supabase-auth>=2.34.1,<2.35",
    "typing-extensions>=4.16.0,<5",
    "tzdata>=2026.2,<2027",
    "uvicorn>=0.54.0,<0.55",
]

[tool.uv]
package = false
